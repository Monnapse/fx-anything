name: Release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a draft GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FX Anything ${{ github.ref_name }}'
          releaseBody: |
            Download the **x64-setup.exe** below, run it, then follow the setup guide in the app.
            Needs the free VB-CABLE driver to route other apps: https://vb-audio.com/Cable/
          releaseDraft: true
          prerelease: false
