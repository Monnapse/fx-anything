[package]
name = "fx-anything"
version = "0.1.0"
description = "Real-time effects on anything your PC plays"
authors = ["FX Anything contributors"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "fx_anything_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.6", features = [] }
tauri-plugin-opener = "2"

# Small, fast release binary
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
